<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<g id="bowl"><ellipse cx="0" cy="-6" rx="34" ry="9" fill="#bfe3ff" stroke="#2a1c15" stroke-width="3"/><path d="M-34 -6 Q-30 26 0 28 Q30 26 34 -6 Z" fill="#3d8fe0" stroke="#2a1c15" stroke-width="3"/></g>
<g id="autoicon"><rect x="-44" y="-44" width="88" height="88" rx="18" fill="#2a1c15"/><rect x="-40" y="-44" width="80" height="80" rx="16" fill="#66d0c4"/><use href="#bowl" transform="translate(0,4) scale(0.9)"/><path d="M-22 -24 A26 26 0 0 1 22 -24" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M22 -36 L26 -22 L12 -20 Z" fill="#fff"/></g>
<g id="swon"><rect x="0" y="0" width="76" height="38" rx="19" fill="#4fcf5a" stroke="#2a1c15" stroke-width="3"/><circle cx="57" cy="19" r="14" fill="#fff" stroke="#2a1c15" stroke-width="2"/><text x="22" y="26" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">ON</text></g>
<g id="swoff"><rect x="0" y="0" width="76" height="38" rx="19" fill="#8a7a70" stroke="#2a1c15" stroke-width="3"/><circle cx="19" cy="19" r="14" fill="#fff" stroke="#2a1c15" stroke-width="2"/><text x="52" y="26" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">OFF</text></g>
<g id="foodrow"><rect width="420" height="96" rx="14" fill="#fff6e8" stroke="#b07be0" stroke-width="5"/><rect x="16" y="14" width="68" height="68" rx="12" fill="#e9c9f7" stroke="#2a1c15" stroke-width="2"/><text x="100" y="40" font-size="22" fill="#2a1c15">Salmor</text><rect x="100" y="50" width="62" height="22" rx="11" fill="#a35ee0"/><text x="131" y="66" font-size="13" fill="#fff" text-anchor="middle">EPIC</text><text x="100" y="90" font-size="17" fill="#6b5446">You have 1</text><rect x="300" y="24" width="104" height="48" rx="10" fill="#2a1c15"/><rect x="302" y="24" width="100" height="44" rx="9" fill="#4fcf5a"/><text x="352" y="54" font-size="20" font-weight="bold" fill="#fff" text-anchor="middle">USE</text></g>
<g id="win"><rect width="740" height="560" rx="22" fill="#2e2522" stroke="#2a1c15" stroke-width="4"/><rect width="740" height="70" rx="22" fill="#5fb0a8"/><rect y="48" width="740" height="22" fill="#5fb0a8"/><circle cx="40" cy="36" r="30" fill="#bfe3e0" stroke="#2a1c15" stroke-width="3"/><use href="#bowl" transform="translate(40,36) scale(0.55)"/><text x="82" y="34" font-size="28" font-weight="bold" fill="#fff" stroke="#2a1c15" stroke-width="1">Fancy Bowl</text><text x="82" y="58" font-size="15" fill="#fff">Put food in and a cat comes to your door</text><rect x="690" y="12" width="40" height="40" rx="9" fill="#ef4d4d" stroke="#2a1c15" stroke-width="3"/><text x="710" y="42" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">X</text>
<rect x="18" y="88" width="260" height="452" rx="14" fill="#3a2e2a" stroke="#241c19" stroke-width="3"/>
<circle cx="148" cy="130" r="30" fill="#e08a4a" stroke="#2a1c15" stroke-width="2"/><text x="148" y="140" font-size="28" text-anchor="middle" fill="#fff">o</text>
<text x="148" y="190" font-size="20" fill="#fff" text-anchor="middle">Your bowl is empty</text><rect x="30" y="200" width="236" height="26" rx="13" fill="#4a3c36"/><text x="148" y="219" font-size="15" fill="#fff" text-anchor="middle">A cat comes by in 9m 0s</text>
<rect x="30" y="486" width="34" height="34" rx="8" fill="#e9c9f7" stroke="#2a1c15" stroke-width="2"/><rect x="72" y="482" width="194" height="42" rx="10" fill="#2a1c15"/><rect x="74" y="482" width="190" height="38" rx="9" fill="#4fcf5a"/><text x="169" y="508" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">Refill</text>
<use href="#foodrow" transform="translate(298,88)"/><use href="#foodrow" transform="translate(298,196)"/><use href="#foodrow" transform="translate(298,304)"/><use href="#foodrow" transform="translate(298,412)"/>
</g>
</defs>
<rect width="1600" height="1000" fill="#241c19"/>
<text x="40" y="56" font-size="38" font-weight="bold" fill="#ffc94d">Auto Bowl game pass (mockup, #4266)</text>
<text x="40" y="92" font-size="20" fill="#d9c8b4">Claims each cat the moment it arrives and refills the bowl with your best food. Switch either off any time.</text>

<g transform="translate(40,120)">
<text x="0" y="24" font-size="24" font-weight="bold" fill="#fff">1. Bowl window, without the pass</text>
<text x="0" y="52" font-size="17" fill="#d9c8b4">The empty space over Refill holds a small offer card.</text>
<use href="#win" transform="translate(0,70)"/>
<g transform="translate(30,320)">
<rect width="236" height="220" rx="14" fill="#fff6e8" stroke="#ffc94d" stroke-width="4"/>
<use href="#autoicon" transform="translate(44,52) scale(0.7)"/>
<text x="84" y="44" font-size="21" font-weight="bold" fill="#2a1c15">Auto Bowl</text>
<text x="84" y="66" font-size="13" fill="#6b5446">Game pass</text>
<text x="14" y="112" font-size="15" fill="#2a1c15">Claims each cat as it arrives</text>
<text x="14" y="134" font-size="15" fill="#2a1c15">Refills with your best food</text>
<rect x="14" y="152" width="208" height="50" rx="12" fill="#2a1c15"/><rect x="16" y="152" width="204" height="45" rx="11" fill="#ffb02e"/><text x="118" y="183" font-size="22" font-weight="bold" fill="#fff" stroke="#2a1c15" stroke-width="1" text-anchor="middle">R$19</text>
</g>
</g>

<g transform="translate(820,120)">
<text x="0" y="24" font-size="24" font-weight="bold" fill="#fff">2. Bowl window, with the pass</text>
<text x="0" y="52" font-size="17" fill="#d9c8b4">The same space holds the two switches, both on when bought.</text>
<use href="#win" transform="translate(0,70)"/>
<g transform="translate(30,320)">
<rect width="236" height="220" rx="14" fill="#fff6e8" stroke="#66d0c4" stroke-width="4"/>
<use href="#autoicon" transform="translate(36,40) scale(0.5)"/>
<text x="70" y="47" font-size="20" font-weight="bold" fill="#2a1c15">AUTO BOWL</text>
<text x="16" y="104" font-size="18" fill="#2a1c15">Auto claim</text><use href="#swon" transform="translate(146,80)"/>
<text x="16" y="154" font-size="18" fill="#2a1c15">Auto refill</text><use href="#swon" transform="translate(146,130)"/>
<text x="16" y="198" font-size="13" fill="#6b5446">Uses only food you have</text>
</g>
</g>

<g transform="translate(40,780)">
<text x="0" y="0" font-size="24" font-weight="bold" fill="#fff">3. Store card (Passes)</text>
<g transform="translate(0,20)">
<rect width="380" height="170" rx="16" fill="#ffe7a8" stroke="#ffc94d" stroke-width="4"/>
<use href="#autoicon" transform="translate(56,56) scale(0.75)"/>
<text x="110" y="52" font-size="24" font-weight="bold" fill="#2a1c15">Auto Bowl</text>
<text x="20" y="114" font-size="14" fill="#6b5446">Claims your cats and</text>
<text x="20" y="134" font-size="14" fill="#6b5446">refills your bowl for you.</text>
<text x="20" y="154" font-size="14" fill="#6b5446">Switch it off any time.</text>
<rect x="240" y="104" width="126" height="46" rx="12" fill="#2a1c15"/><rect x="242" y="104" width="122" height="42" rx="11" fill="#ffb02e"/><text x="303" y="133" font-size="20" font-weight="bold" fill="#fff" stroke="#2a1c15" stroke-width="1" text-anchor="middle">R$19</text>
</g>
</g>

<g transform="translate(470,780)">
<text x="0" y="0" font-size="24" font-weight="bold" fill="#fff">4. Price pick and rules</text>
<text x="0" y="40" font-size="18" fill="#ffc94d">R$19 (Derek's range R$10 to 25)</text>
<text x="0" y="68" font-size="16" fill="#d9c8b4">Under 2x Money's R$25, so it reads as a small add-on; regional pricing on.</text>
<text x="0" y="96" font-size="16" fill="#d9c8b4">Auto claim tames the cat (as tapping Tame does); with no free cat slot it waits, as now.</text>
<text x="0" y="124" font-size="16" fill="#d9c8b4">Auto refill uses only food the player owns, best first, never buys any. Not a random item.</text>
<text x="0" y="152" font-size="16" fill="#d9c8b4">Works with two bowls. Bowl tile "!" (#4267): empty bowl with food to put in, or a cat waiting.</text>
</g>
