<g font-size="19" fill="#fff6e8">
<text x="24" y="104">Tap Menu, then Feedback.</text>
<text x="24" y="136">Opens the same Feedback window</text>
<text x="24" y="162">as today (faces, Bug, Stuck, Idea).</text>
<text x="24" y="206">Settings keeps its Feedback row</text>
<text x="24" y="232">at the top too.</text>
<text x="24" y="276">The map theme bubble that sat</text>
<text x="24" y="302">under Feedback points at Menu.</text>
</g>
<rect x="24" y="336" width="652" height="110" rx="14" fill="#3f332e" stroke="#5e4c42" stroke-width="2"/>
<text x="44" y="372" font-size="20" font-weight="bold" fill="#ffc94d">Sending (Derek only)</text>
<text x="44" y="402" font-size="17" fill="#fff6e8">Chat command or a GitHub button: to everyone or named players,</text>
<text x="44" y="428" font-size="17" fill="#fff6e8">a note, a gift and an end date. No Robux items. Pays once each.</text>
</g>

